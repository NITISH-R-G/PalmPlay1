name: Repository Automation

on:
  push:
    branches: [ "main", "master" ]
  pull_request:
    branches: [ "main", "master" ]
  schedule:
    # Run at 00:00 every Sunday
    - cron: '0 0 * * 0'
  release:
    types: [published]

jobs:
  ci-checks:
    name: CI Checks (Test, Lint, Audit)
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          if [ -f requirements.txt ]; then pip install -r requirements.txt; fi
          pip install pylint pytest bandit safety

      - name: Run Linting
        run: |
          pylint $(git ls-files '*.py') || true

      - name: Run Tests
        run: |
          if [ -d tests ]; then pytest tests/; else echo "No tests directory found."; fi
          if [ -f check_env.py ]; then python check_env.py; fi

      - name: Security Scans (Bandit)
        run: |
          bandit -r . || true

      - name: Dependency Audit (Safety)
        run: |
          safety check || true

  repo-maintenance:
    name: Autonomous Repository Maintenance
    runs-on: ubuntu-latest
    needs: ci-checks
    permissions:
      contents: write
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0 # Needed to analyze commit history if required

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'

      - name: Install documentation dependencies
        run: |
          python -m pip install --upgrade pip
          pip install openai jinja2 requests pyyaml

      - name: Run Repository Analyzer
        run: |
          python .github/scripts/repo_analyzer.py

      - name: Generate Architecture Diagrams
        run: |
          python .github/scripts/generate_diagrams.py

      - name: AI Documentation Agent (Auto-Update README)
        env:
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          python .github/scripts/ai_docs_agent.py

      - name: Commit and Push Changes
        uses: stefanzweifel/git-auto-commit-action@v5
        with:
          commit_message: "docs: update repository documentation and diagrams [skip ci]"
          branch: ${{ github.head_ref || github.ref_name }}
          file_pattern: 'README.md .github/docs/* repo_analysis.json'
          commit_user_name: "github-actions[bot]"
          commit_user_email: "github-actions[bot]@users.noreply.github.com"
          commit_author: "github-actions[bot] <github-actions[bot]@users.noreply.github.com>"
